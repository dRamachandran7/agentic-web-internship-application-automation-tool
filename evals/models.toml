# Models the eval can run. Select with --models name1,name2.
#
# price_in / price_out are USD per 1M tokens, used only for the cost column.
# Groq and Ollama prices drift — check console.groq.com/docs/models (and
# what your account can actually call) before trusting the cost numbers.
#
# Keys:
#   provider          groq | anthropic | openai_compatible
#   model             the provider's model ID
#   concurrency       parallel cases for this model (keep low on free tiers)
#   effort            anthropic: low | medium | high | xhigh | max
#   structured_output anthropic: constrain analyze_listing's JSON to its schema
#   fallbacks         anthropic: "default" to enable server-side refusal
#                     fallbacks. Off here on purpose — a fallback answers with a
#                     different model, which would blur that model's score.
#   base_url, api_key_env, drop_temperature, max_tokens_param, request_extra
#                     openai_compatible only

# --- Groq: same SDK and code path as production, just set GROQ_MODEL ---------
# The service default, llama-3.3-70b-versatile, is no longer served (404
# model_not_found as of 2026-10-30), and neither is llama-3.1-8b-instant.
# These are the general chat models a Groq key could call on that date.
# Prices are unverified: confirm them at console.groq.com/docs/models.
[models."groq-gpt-oss-120b"]
provider = "groq"
model = "openai/gpt-oss-120b"
price_in = 0.15
price_out = 0.75
concurrency = 1          # free-tier TPM limits; raise on a paid key
notes = "reasoning model; price unverified"

[models."groq-gpt-oss-20b"]
provider = "groq"
model = "openai/gpt-oss-20b"
price_in = 0.075
price_out = 0.30
concurrency = 1
notes = "smaller reasoning model; price unverified"

[models."groq-qwen3.8-27b"]
provider = "groq"
model = "qwen/qwen3.8-27b"
price_in = 0.0
price_out = 0.0
concurrency = 1
notes = "price unknown - fill in from console.groq.com"

# --- Claude (needs ANTHROPIC_API_KEY or `ant auth login`) ---------------------
[models."claude-haiku-5-5"]
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "low"
price_in = 0.10
price_out = 0.50
concurrency = 4
notes = "price is for prompts <=100K tokens"

[models."claude-sonnet-5-5"]
provider = "anthropic"
model = "claude-sonnet-5-5"
effort = "medium"
price_in = 2.0
price_out = 10.0
concurrency = 4

[models."claude-opus-5-5"]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"
price_in = 4.0
price_out = 20.0
concurrency = 4

# Same model, but no schema-constrained output: simulates swapping the model
# name without touching analyze_listing's `json.loads(raw)`.
[models."claude-haiku-5-5-no-schema"]
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "low"
structured_output = false
price_in = 0.10
price_out = 0.50
concurrency = 4
notes = "measures JSON robustness without structured outputs"

# --- Any OpenAI-compatible endpoint (local Ollama shown) ----------------------
[models."ollama-llama3.1-8b"]
provider = "openai_compatible"
base_url = "http://localhost:11434/v1"
model = "llama3.1:8b"
api_key_env = "OLLAMA_API_KEY"   # unset is fine for Ollama
concurrency = 1
notes = "local, free, private; run `ollama pull llama3.1:8b` first"
